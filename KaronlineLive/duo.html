<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>KaronlineBox Duo — FaceTime Karaoké</title>
  <link rel="stylesheet" href="css/styles.css?v=14">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #030507;
      color: #f4f7fb;
      font-family: var(--font-body, 'DM Sans', sans-serif);
      overflow: hidden;
    }

    .duo-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    /* Hôte en Grand */
    .host-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: radial-gradient(circle at center, #081424, #020406);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .host-video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .host-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #9aa9b7;
      text-align: center;
      padding: 20px;
    }

    .host-placeholder .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(20, 92, 255, 0.2);
      border-top-color: #145cff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Incrustation Karaoké + Paroles (PiP) */
    .karaoke-pip {
      position: absolute;
      bottom: 90px;
      left: 16px;
      right: 16px;
      height: 140px;
      background: rgba(8, 14, 21, 0.92);
      border: 1px solid rgba(0, 200, 255, 0.4);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      z-index: 10;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .pip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #00c8ff;
      font-weight: 700;
    }

    .pip-song-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .pip-lyrics-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
      color: #00ffe1;
      text-shadow: 0 0 10px rgba(0, 255, 225, 0.4);
      padding: 4px 0;
    }

    .pip-progress {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .pip-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #145cff, #00c8ff);
      transition: width 0.3s linear;
    }

    /* Webcam de l'invité (Self-View Thumbnail) */
    .self-video-thumb {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 100px;
      height: 140px;
      background: #000;
      border: 2px solid #145cff;
      border-radius: 10px;
      overflow: hidden;
      z-index: 12;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .self-video-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* Barre d'outils inférieure */
    .duo-controls {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      height: 60px;
      background: rgba(8, 14, 21, 0.95);
      border: 1px solid var(--line, #20323b);
      border-radius: 30px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 16px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .ctrl-btn:active {
      transform: scale(0.92);
    }

    .ctrl-btn.off {
      background: #e80055;
      color: #fff;
    }

    .ctrl-btn.leave {
      background: #ef4444;
    }

    /* Écran de permission/rejointure initiale */
    .permission-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(ellipse at 75% 0%, rgba(0,112,255,.25), transparent 50%), #030507;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .permission-card {
      background: rgba(8, 14, 21, 0.9);
      border: 1px solid var(--line, #20323b);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .permission-card h1 {
      font-family: var(--font-display, 'Barlow Condensed', sans-serif);
      font-size: 32px;
      margin: 0 0 8px;
    }

    .permission-card h1 span {
      color: #145cff;
    }

    .permission-card p {
      color: #9aa9b7;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .join-btn {
      width: 100%;
      height: 52px;
      font-size: 17px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- ÉCRAN D'AUTORISATION INITIAL -->
  <div id="permission-screen" class="permission-screen">
    <div class="permission-card">
      <p class="eyebrow" style="color:#e80055;font-weight:700;letter-spacing:.06em;">KARONLINEBOX DUO</p>
      <h1>Chantez <span>Ensemble</span></h1>
      <p>Rejoignez la session karaoké en direct. Autorisez votre caméra et microphone pour apparaître à l'écran !</p>
      <button id="join-btn" class="button button-primary join-btn" type="button">🎙 AUTORISER &amp; REJOINDRE</button>
    </div>
  </div>

  <!-- INTERFACE PRINCIPALE FACETIME KARAOKÉ -->
  <div class="duo-container">
    
    <!-- Hôte en Grand -->
    <div class="host-video-container">
      <video id="remote-video" autoplay playsinline></video>
      <div id="host-placeholder" class="host-placeholder">
        <div class="spinner"></div>
        <p><strong>Connexion à l'hôte...</strong><br>Préparez-vous à chanter !</p>
      </div>
    </div>

    <!-- Vignette Self-View (Invité) -->
    <div class="self-video-thumb">
      <video id="local-video" autoplay playsinline muted></video>
    </div>

    <!-- PiP Karaoké & Paroles Synchro -->
    <div class="karaoke-pip">
      <div class="pip-header">
        <span>● EN DIRECT</span>
        <span id="pip-singer">Chanteur : Prêt</span>
      </div>
      <div id="pip-song-title" class="pip-song-title">Prêt pour la chanson...</div>
      <div id="pip-lyrics" class="pip-lyrics-box">🎵 Les paroles s'afficheront ici 🎵</div>
      <div class="pip-progress">
        <div id="pip-progress-bar" class="pip-progress-bar"></div>
      </div>
    </div>

    <!-- Contrôles Inférieurs -->
    <div class="duo-controls">
      <button id="mic-toggle" class="ctrl-btn" type="button" aria-label="Microphone">🎤</button>
      <button id="cam-toggle" class="ctrl-btn" type="button" aria-label="Caméra">📹</button>
      <button id="leave-btn" class="ctrl-btn leave" type="button" aria-label="Quitter">✕</button>
    </div>
  </div>

  <script src="js/config.js?v=13"></script>
  <script src="js/duo_client.js?v=1"></script>
</body>
</html>
